<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeleFilter Panel</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { font-family: 'Vazirmatn', sans-serif; box-sizing: border-box; }
    body { background: #f1f5f9; height: 100vh; overflow: hidden; margin: 0; }

    /* ── Navbar ── */
    .topbar {
      height: 56px;
      background: #1e40af;
      display: flex;
      align-items: center;
      padding: 0 1.25rem;
      gap: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
      position: relative;
      z-index: 10;
    }
    .topbar-brand { color: #fff; font-weight: 700; font-size: 1.15rem; display: flex; align-items: center; gap: .4rem; }
    .topbar-brand i { font-size: 1.3rem; color: #93c5fd; }
    .topbar-actions { margin-right: auto; display: flex; gap: .5rem; }
    .btn-api { color: #bfdbfe; border: 1px solid #3b5fc0; background: transparent; font-size: .82rem; padding: .3rem .8rem; border-radius: 8px; cursor: pointer; transition: all .15s; }
    .btn-api:hover { background: rgba(255,255,255,.1); color: #fff; }
    .btn-save { background: #22c55e; border: none; color: #fff; font-size: .82rem; font-weight: 600; padding: .3rem 1rem; border-radius: 8px; cursor: pointer; transition: all .2s; display: flex; align-items: center; gap: .3rem; }
    .btn-save:hover { background: #16a34a; }
    .btn-save.dirty { background: #f59e0b; }
    .btn-save.saved { background: #22c55e; }

    /* ── Layout ── */
    .layout { display: flex; height: calc(100vh - 56px); }

    /* ── Sidebar ── */
    .sidebar {
      width: 255px;
      flex-shrink: 0;
      background: #fff;
      border-left: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-head {
      padding: .85rem 1rem;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .sidebar-head span { font-weight: 600; font-size: .9rem; color: #334155; }
    .sidebar-list { overflow-y: auto; flex: 1; }
    .topic-row {
      padding: .7rem 1rem;
      cursor: pointer;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background .12s;
    }
    .topic-row:hover { background: #f8fafc; }
    .topic-row.active { background: #eff6ff; border-right: 3px solid #2563eb; }
    .topic-row .t-name { font-weight: 500; font-size: .88rem; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 155px; }
    .topic-row .t-meta { font-size: .72rem; color: #94a3b8; margin-top: 1px; }
    .topic-row .del-btn { background: none; border: none; color: #cbd5e1; cursor: pointer; padding: 2px 4px; border-radius: 4px; flex-shrink: 0; }
    .topic-row .del-btn:hover { color: #ef4444; background: #fef2f2; }
    .sidebar-empty { padding: 1.5rem 1rem; text-align: center; color: #94a3b8; font-size: .83rem; }

    /* ── Main ── */
    .main { flex: 1; overflow-y: auto; padding: 1.5rem 2rem; }

    /* ── Empty State ── */
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 70%; color: #cbd5e1; text-align: center; }
    .empty-state i { font-size: 4.5rem; margin-bottom: .75rem; }
    .empty-state h5 { color: #94a3b8; font-weight: 500; }
    .empty-state p { font-size: .85rem; color: #cbd5e1; }

    /* ── Topic header inputs ── */
    .topic-header { display: flex; align-items: flex-end; gap: 1rem; margin-bottom: 1.75rem; }
    .topic-header .name-wrap { flex: 1; }
    .topic-header .id-wrap { width: 110px; }
    .topic-header label { font-size: .78rem; color: #64748b; margin-bottom: .25rem; display: block; }
    .topic-header input { border: 1.5px solid #e2e8f0; border-radius: 10px; padding: .5rem .85rem; font-size: .95rem; width: 100%; outline: none; transition: border .15s; }
    .topic-header input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px #eff6ff; }
    .topic-header .id-wrap input { text-align: center; }

    /* ── Section header ── */
    .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: .85rem; }
    .section-head h6 { font-weight: 600; font-size: .9rem; color: #334155; margin: 0; display: flex; align-items: center; gap: .4rem; }
    .section-head h6 i { color: #2563eb; }

    /* ── Source card ── */
    .source-card {
      background: #fff;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      padding: 1rem 1.1rem;
      margin-bottom: .75rem;
      transition: border .15s, box-shadow .15s;
    }
    .source-card:hover { border-color: #93c5fd; box-shadow: 0 0 0 3px #eff6ff; }
    .source-top { display: flex; align-items: center; gap: .6rem; margin-bottom: .65rem; }
    .source-top i { color: #2aabee; font-size: 1.25rem; flex-shrink: 0; }
    .source-top input {
      flex: 1;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      padding: .35rem .75rem;
      font-size: .87rem;
      direction: ltr;
      outline: none;
      transition: border .15s;
    }
    .source-top input:focus { border-color: #3b82f6; }
    .source-top .src-del { background: none; border: none; color: #cbd5e1; cursor: pointer; padding: 3px 6px; border-radius: 6px; flex-shrink: 0; font-size: 1rem; }
    .source-top .src-del:hover { color: #ef4444; background: #fef2f2; }

    /* ── Filter area ── */
    .filter-area { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; padding-top: .25rem; }
    .filter-label { font-size: .75rem; color: #94a3b8; flex-shrink: 0; margin-left: 2px; }
    .filter-tag {
      display: inline-flex;
      align-items: center;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      border-radius: 20px;
      padding: 3px 10px 3px 6px;
      font-size: .8rem;
      gap: 3px;
    }
    .filter-tag button { background: none; border: none; color: #93c5fd; cursor: pointer; padding: 0; font-size: .75rem; line-height: 1; }
    .filter-tag button:hover { color: #ef4444; }
    .all-badge {
      background: #fef9c3;
      color: #854d0e;
      border: 1px solid #fde047;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: .78rem;
    }
    .filter-input {
      border: 1.5px dashed #93c5fd;
      border-radius: 20px;
      padding: 3px 12px;
      font-size: .8rem;
      font-family: 'Vazirmatn', sans-serif;
      outline: none;
      width: 150px;
      background: #f8fafc;
      transition: border .15s, background .15s;
    }
    .filter-input:focus { border-color: #2563eb; background: #fff; }
    .filter-input::placeholder { color: #94a3b8; }

    /* ── No sources placeholder ── */
    .no-sources { text-align: center; padding: 2rem 1rem; color: #94a3b8; font-size: .85rem; }
    .no-sources i { font-size: 2.5rem; opacity: .35; display: block; margin-bottom: .5rem; }

    /* ── Buttons ── */
    .btn-add-src {
      background: #f8fafc;
      border: 1.5px dashed #cbd5e1;
      border-radius: 12px;
      color: #64748b;
      padding: .55rem 1.2rem;
      font-size: .85rem;
      font-family: 'Vazirmatn', sans-serif;
      cursor: pointer;
      width: 100%;
      transition: all .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .4rem;
    }
    .btn-add-src:hover { border-color: #2563eb; color: #2563eb; background: #eff6ff; }

    /* ── Modals ── */
    .modal-content { border-radius: 16px; border: none; box-shadow: 0 20px 60px rgba(0,0,0,.15); }
    .modal-header { border-bottom: 1px solid #f1f5f9; padding: 1.1rem 1.4rem; }
    .modal-body { padding: 1.4rem; }
    .modal-footer { border-top: 1px solid #f1f5f9; padding: .9rem 1.4rem; }
    .form-label { font-size: .82rem; color: #475569; font-weight: 500; }
    .form-control { border: 1.5px solid #e2e8f0; border-radius: 10px; padding: .5rem .9rem; font-family: 'Vazirmatn', sans-serif; }
    .form-control:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px #eff6ff; }
    .form-text { font-size: .76rem; color: #94a3b8; margin-top: 4px; }
  </style>
</head>
<body>

<!-- ══════════════ TOPBAR ══════════════ -->
<div class="topbar">
  <div class="topbar-brand">
    <i class="bi bi-telegram"></i>
    TeleFilter
  </div>
  <div class="topbar-actions">
    <button class="btn-api" onclick="openSettings()">
      <i class="bi bi-gear-fill"></i> تنظیمات API
    </button>
    <button class="btn-save dirty" id="saveBtn" onclick="saveAll()">
      <i class="bi bi-floppy-fill"></i> ذخیره تغییرات
    </button>
  </div>
</div>

<!-- ══════════════ LAYOUT ══════════════ -->
<div class="layout">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-head">
      <span><i class="bi bi-bookmarks-fill me-1" style="color:#2563eb"></i> Topics</span>
      <button class="btn btn-sm btn-primary" style="border-radius:8px;padding:3px 10px" onclick="addTopic()">
        <i class="bi bi-plus-lg"></i>
      </button>
    </div>
    <div class="sidebar-list" id="topicList"></div>
  </div>

  <!-- Main Panel -->
  <div class="main" id="mainPanel">
    <div class="empty-state">
      <i class="bi bi-ui-checks-grid"></i>
      <h5>یک Topic انتخاب کن</h5>
      <p>یا با دکمه <strong>+</strong> در سایدبار یک Topic جدید بساز</p>
    </div>
  </div>
</div>

<!-- ══════════════ SETTINGS MODAL ══════════════ -->
<div class="modal fade" id="settingsModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-600"><i class="bi bi-gear-fill me-2" style="color:#2563eb"></i>تنظیمات API تلگرام</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">API ID</label>
          <input type="text" class="form-control" id="s_api_id" dir="ltr" placeholder="12345678">
        </div>
        <div class="mb-3">
          <label class="form-label">API Hash</label>
          <input type="text" class="form-control font-monospace" id="s_api_hash" dir="ltr" placeholder="abc123...">
        </div>
        <div class="mb-1">
          <label class="form-label">Target Group ID</label>
          <input type="text" class="form-control" id="s_group_id" dir="ltr" placeholder="-1001234567890">
          <div class="form-text">ID گروهی که Topics دارد و پیام‌ها در آن فوروارد می‌شوند</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" style="border-radius:9px" onclick="saveSettings()">
          <i class="bi bi-check-lg me-1"></i>ذخیره
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ═══════════════════════════════════════════
//  State
// ═══════════════════════════════════════════
let cfg = { api_id: '', api_hash: '', target_group_id: '', topics: [] };
let selIdx = -1;
let settingsModal;

// ═══════════════════════════════════════════
//  Boot
// ═══════════════════════════════════════════
document.addEventListener('DOMContentLoaded', async () => {
  settingsModal = new bootstrap.Modal(document.getElementById('settingsModal'));
  await loadConfig();
  renderAll();
  markClean();
});

async function loadConfig() {
  const res = await fetch('/api/config');
  cfg = await res.json();
  if (!Array.isArray(cfg.topics)) cfg.topics = [];
}

async function saveAll() {
  await fetch('/api/config', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(cfg)
  });
  markClean();
}

function markDirty() {
  const b = document.getElementById('saveBtn');
  b.className = 'btn-save dirty';
  b.innerHTML = '<i class="bi bi-floppy-fill"></i> ذخیره تغییرات *';
}

function markClean() {
  const b = document.getElementById('saveBtn');
  b.className = 'btn-save saved';
  b.innerHTML = '<i class="bi bi-check-lg"></i> ذخیره شد';
  setTimeout(() => {
    b.innerHTML = '<i class="bi bi-floppy-fill"></i> ذخیره تغییرات';
  }, 2000);
}

// ═══════════════════════════════════════════
//  Settings
// ═══════════════════════════════════════════
function openSettings() {
  document.getElementById('s_api_id').value = cfg.api_id || '';
  document.getElementById('s_api_hash').value = cfg.api_hash || '';
  document.getElementById('s_group_id').value = cfg.target_group_id || '';
  settingsModal.show();
}

function saveSettings() {
  cfg.api_id = document.getElementById('s_api_id').value.trim();
  cfg.api_hash = document.getElementById('s_api_hash').value.trim();
  cfg.target_group_id = document.getElementById('s_group_id').value.trim();
  settingsModal.hide();
  markDirty();
}

// ═══════════════════════════════════════════
//  Topics — CRUD
// ═══════════════════════════════════════════
function addTopic() {
  cfg.topics.push({ name: 'Topic جدید', topic_id: '', sources: [] });
  selIdx = cfg.topics.length - 1;
  renderAll();
  markDirty();
  // focus name input
  setTimeout(() => document.querySelector('.topic-header .name-wrap input')?.focus(), 60);
}

function deleteTopic(idx, e) {
  e.stopPropagation();
  if (!confirm('این Topic و همه سورس‌هایش حذف شود؟')) return;
  cfg.topics.splice(idx, 1);
  if (selIdx >= cfg.topics.length) selIdx = cfg.topics.length - 1;
  renderAll();
  markDirty();
}

function selectTopic(idx) {
  selIdx = idx;
  renderAll();
}

function updateTopicName(val) {
  cfg.topics[selIdx].name = val;
  renderSidebar();
  markDirty();
}

function updateTopicId(val) {
  cfg.topics[selIdx].topic_id = val ? parseInt(val) : '';
  renderSidebar();
  markDirty();
}

// ═══════════════════════════════════════════
//  Sources — CRUD
// ═══════════════════════════════════════════
function addSource() {
  cfg.topics[selIdx].sources.push({ chat: '', filters: [] });
  renderMain();
  markDirty();
  setTimeout(() => {
    const inputs = document.querySelectorAll('.source-top input');
    if (inputs.length) inputs[inputs.length - 1].focus();
  }, 60);
}

function deleteSource(si) {
  cfg.topics[selIdx].sources.splice(si, 1);
  renderMain();
  markDirty();
}

function updateSourceChat(si, val) {
  cfg.topics[selIdx].sources[si].chat = val;
  markDirty();
}

// ═══════════════════════════════════════════
//  Filters — CRUD
// ═══════════════════════════════════════════
function addFilter(si, inputEl) {
  const phrase = inputEl.value.trim();
  if (!phrase) return;
  cfg.topics[selIdx].sources[si].filters.push(phrase);
  inputEl.value = '';
  renderMain();
  markDirty();
  // restore focus on the same source's input
  setTimeout(() => {
    const inputs = document.querySelectorAll(`.filter-input`);
    if (inputs[si]) inputs[si].focus();
  }, 40);
}

function handleFilterKey(e, si) {
  if (e.key === 'Enter') addFilter(si, e.target);
}

function deleteFilter(si, fi) {
  cfg.topics[selIdx].sources[si].filters.splice(fi, 1);
  renderMain();
  markDirty();
}

// ═══════════════════════════════════════════
//  Render
// ═══════════════════════════════════════════
function renderAll() {
  renderSidebar();
  renderMain();
}

function renderSidebar() {
  const el = document.getElementById('topicList');
  if (!cfg.topics.length) {
    el.innerHTML = '<div class="sidebar-empty">هنوز Topic ای نساختی<br>با دکمه + شروع کن</div>';
    return;
  }
  el.innerHTML = cfg.topics.map((t, i) => `
    <div class="topic-row ${i === selIdx ? 'active' : ''}" onclick="selectTopic(${i})">
      <div style="overflow:hidden">
        <div class="t-name">${esc(t.name || 'بدون نام')}</div>
        <div class="t-meta">ID: ${t.topic_id || '—'} &nbsp;·&nbsp; ${(t.sources||[]).length} سورس</div>
      </div>
      <button class="del-btn" onclick="deleteTopic(${i}, event)" title="حذف">
        <i class="bi bi-trash3"></i>
      </button>
    </div>
  `).join('');
}

function renderMain() {
  const el = document.getElementById('mainPanel');

  if (selIdx < 0 || selIdx >= cfg.topics.length) {
    el.innerHTML = `
      <div class="empty-state">
        <i class="bi bi-ui-checks-grid"></i>
        <h5>یک Topic انتخاب کن</h5>
        <p>یا با دکمه <strong>+</strong> در سایدبار یک Topic جدید بساز</p>
      </div>`;
    return;
  }

  const topic = cfg.topics[selIdx];
  const sources = topic.sources || [];

  el.innerHTML = `
    <!-- Topic Header -->
    <div class="topic-header">
      <div class="name-wrap">
        <label>نام Topic</label>
        <input type="text" value="${esc(topic.name || '')}"
          onchange="updateTopicName(this.value)"
          placeholder="مثال: دلار">
      </div>
      <div class="id-wrap">
        <label>Topic ID</label>
        <input type="number" value="${topic.topic_id || ''}"
          onchange="updateTopicId(this.value)"
          placeholder="5">
      </div>
    </div>

    <!-- Sources Section -->
    <div class="section-head">
      <h6><i class="bi bi-broadcast-pin"></i> سورس‌ها</h6>
      <button class="btn btn-sm btn-outline-primary" style="border-radius:8px;font-size:.82rem" onclick="addSource()">
        <i class="bi bi-plus-lg me-1"></i>افزودن سورس
      </button>
    </div>

    ${sources.length === 0 ? `
      <div class="no-sources">
        <i class="bi bi-inbox"></i>
        هنوز سورسی اضافه نشده.<br>روی «افزودن سورس» کلیک کن.
      </div>
    ` : sources.map((src, si) => `
      <div class="source-card">
        <div class="source-top">
          <i class="bi bi-telegram"></i>
          <input type="text" dir="ltr"
            value="${esc(src.chat || '')}"
            onchange="updateSourceChat(${si}, this.value)"
            placeholder="@username  یا  Chat ID عددی">
          <button class="src-del" onclick="deleteSource(${si})" title="حذف سورس">
            <i class="bi bi-x-circle-fill"></i>
          </button>
        </div>

        <div class="filter-area">
          <span class="filter-label">فیلترها:</span>

          ${(src.filters || []).map((f, fi) => `
            <span class="filter-tag">
              ${esc(f)}
              <button onclick="deleteFilter(${si}, ${fi})" title="حذف فیلتر">
                <i class="bi bi-x"></i>
              </button>
            </span>
          `).join('')}

          ${!(src.filters||[]).length
            ? `<span class="all-badge"><i class="bi bi-asterisk me-1"></i>همه پیام‌ها</span>`
            : ''}

          <input class="filter-input"
            placeholder="فیلتر جدید…  Enter"
            onkeydown="handleFilterKey(event, ${si})"
            title="یک کلمه یا عبارت بنویس و Enter بزن">
        </div>
      </div>
    `).join('')}

    ${sources.length > 0 ? `
      <button class="btn-add-src" onclick="addSource()">
        <i class="bi bi-plus-circle"></i> افزودن سورس دیگر
      </button>
    ` : ''}
  `;
}

// ═══════════════════════════════════════════
//  Utils
// ═══════════════════════════════════════════
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
