<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeleFilter Panel</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { font-family: 'Vazirmatn', sans-serif; box-sizing: border-box; }
    body { background: #f1f5f9; height: 100vh; overflow: hidden; margin: 0; }

    /* ── Topbar ─────────────────────────────────── */
    .topbar {
      height: 56px; background: #1e40af;
      display: flex; align-items: center; padding: 0 1.25rem; gap: .75rem;
      box-shadow: 0 2px 10px rgba(0,0,0,.25); position: relative; z-index: 20;
    }
    .topbar-brand { color: #fff; font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; gap: .4rem; flex-shrink: 0; }
    .topbar-brand i { color: #93c5fd; font-size: 1.3rem; }

    .conn-badge {
      display: flex; align-items: center; gap: .35rem;
      font-size: .75rem; padding: 4px 10px; border-radius: 20px; font-weight: 500;
    }
    .conn-badge.ok  { background: rgba(34,197,94,.2); color: #86efac; }
    .conn-badge.err { background: rgba(239,68,68,.2);  color: #fca5a5; }
    .conn-badge.loading { background: rgba(251,191,36,.2); color: #fde68a; }
    .conn-badge i { font-size: .65rem; }

    .topbar-actions { margin-right: auto; display: flex; gap: .5rem; align-items: center; }
    .btn-topbar { border: 1px solid rgba(255,255,255,.25); background: transparent; color: #bfdbfe;
      font-size: .8rem; padding: .3rem .85rem; border-radius: 8px; cursor: pointer; transition: all .15s;
      display: flex; align-items: center; gap: .3rem; font-family: 'Vazirmatn', sans-serif; }
    .btn-topbar:hover { background: rgba(255,255,255,.1); color: #fff; }
    .btn-save { background: #16a34a; border: none; color: #fff; font-size: .8rem; font-weight: 600;
      padding: .3rem 1rem; border-radius: 8px; cursor: pointer; transition: background .2s;
      display: flex; align-items: center; gap: .35rem; font-family: 'Vazirmatn', sans-serif; }
    .btn-save:hover  { background: #15803d; }
    .btn-save.dirty  { background: #d97706; }

    /* ── Layout ─────────────────────────────────── */
    .layout { display: flex; height: calc(100vh - 56px); }

    /* ── Sidebar ─────────────────────────────────── */
    .sidebar { width: 260px; flex-shrink: 0; background: #fff;
      border-left: 1px solid #e2e8f0; display: flex; flex-direction: column; overflow: hidden; }
    .sidebar-head { padding: .8rem 1rem; border-bottom: 1px solid #e2e8f0;
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; gap: .4rem; }
    .sidebar-head-title { font-weight: 600; font-size: .88rem; color: #334155; display: flex; align-items: center; gap: .35rem; }
    .sidebar-head-title i { color: #2563eb; }
    .sidebar-head-btns { display: flex; gap: .3rem; }
    .sidebar-list { overflow-y: auto; flex: 1; }

    /* Topic rows */
    .topic-row {
      padding: .65rem 1rem; cursor: pointer; border-bottom: 1px solid #f8fafc;
      display: flex; align-items: center; justify-content: space-between; gap: .5rem;
      transition: background .1s; position: relative;
    }
    .topic-row:hover { background: #f8fafc; }
    .topic-row.active { background: #eff6ff; }
    .topic-row.active::after {
      content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 3px; background: #2563eb; border-radius: 3px 0 0 3px;
    }
    .t-name { font-weight: 500; font-size: .87rem; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .t-meta { font-size: .71rem; color: #94a3b8; margin-top: 2px; }
    .t-src-badge {
      background: #eff6ff; color: #2563eb; border-radius: 12px;
      font-size: .68rem; padding: 1px 7px; font-weight: 600; white-space: nowrap; flex-shrink: 0;
    }
    .t-src-badge.empty { background: #f1f5f9; color: #94a3b8; }
    .t-del { background: none; border: none; color: #e2e8f0; cursor: pointer;
      padding: 2px 4px; border-radius: 4px; flex-shrink: 0; transition: all .15s; font-size: .9rem; }
    .t-del:hover { color: #ef4444; background: #fef2f2; }

    .sidebar-msg { padding: 1.5rem 1rem; text-align: center; color: #94a3b8; font-size: .82rem; line-height: 1.6; }
    .sidebar-msg i { display: block; font-size: 2rem; opacity: .4; margin-bottom: .5rem; }

    /* ── Main panel ──────────────────────────────── */
    .main { flex: 1; overflow-y: auto; padding: 1.75rem 2rem; }

    .empty-state { display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 70%; color: #cbd5e1; text-align: center; }
    .empty-state i { font-size: 5rem; margin-bottom: .75rem; }
    .empty-state h5 { color: #94a3b8; font-weight: 500; }
    .empty-state p  { font-size: .85rem; }

    /* Topic header */
    .topic-hdr { display: flex; align-items: center; gap: .75rem; margin-bottom: 1.75rem;
      padding-bottom: 1.25rem; border-bottom: 1px solid #f1f5f9; }
    .topic-hdr-icon { width: 42px; height: 42px; border-radius: 12px; background: #eff6ff;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .topic-hdr-icon i { color: #2563eb; font-size: 1.3rem; }
    .topic-hdr-title { font-size: 1.15rem; font-weight: 700; color: #1e293b; margin: 0; }
    .topic-hdr-id { font-size: .75rem; color: #94a3b8; margin-top: 2px; }

    /* Section head */
    .sec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: .9rem; }
    .sec-head h6 { font-weight: 600; font-size: .88rem; color: #334155; margin: 0;
      display: flex; align-items: center; gap: .4rem; }
    .sec-head h6 i { color: #2563eb; }

    /* Source card */
    .source-card { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 14px;
      padding: 1rem 1.1rem; margin-bottom: .7rem; transition: border .15s, box-shadow .15s; }
    .source-card:hover { border-color: #93c5fd; box-shadow: 0 0 0 3px #eff6ff; }

    .src-top { display: flex; align-items: center; gap: .6rem; margin-bottom: .6rem; }
    .src-top i { color: #2aabee; font-size: 1.2rem; flex-shrink: 0; }
    .src-top input {
      flex: 1; border: 1.5px solid #e2e8f0; border-radius: 8px;
      padding: .35rem .75rem; font-size: .87rem; direction: ltr;
      outline: none; transition: border .15s; font-family: 'Vazirmatn', sans-serif;
    }
    .src-top input:focus { border-color: #3b82f6; }
    .src-del { background: none; border: none; color: #e2e8f0; cursor: pointer;
      padding: 3px 6px; border-radius: 6px; flex-shrink: 0; font-size: 1rem; transition: all .15s; }
    .src-del:hover { color: #ef4444; background: #fef2f2; }

    /* Filter area */
    .filter-area { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; padding-top: .2rem; }
    .filter-lbl { font-size: .74rem; color: #94a3b8; flex-shrink: 0; }
    .filter-tag { display: inline-flex; align-items: center; gap: 3px;
      background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe;
      border-radius: 20px; padding: 3px 8px 3px 5px; font-size: .79rem; }
    .filter-tag button { background: none; border: none; color: #93c5fd;
      cursor: pointer; padding: 0; font-size: .7rem; line-height: 1; }
    .filter-tag button:hover { color: #ef4444; }
    .all-badge { background: #fef9c3; color: #854d0e; border: 1px solid #fde047;
      border-radius: 20px; padding: 3px 10px; font-size: .77rem; }
    .filter-input { border: 1.5px dashed #93c5fd; border-radius: 20px; padding: 3px 12px;
      font-size: .79rem; font-family: 'Vazirmatn', sans-serif; outline: none;
      width: 145px; background: #f8fafc; transition: border .15s, background .15s; }
    .filter-input:focus { border-color: #2563eb; background: #fff; }
    .filter-input::placeholder { color: #94a3b8; }

    /* No sources */
    .no-sources { text-align: center; padding: 2rem; color: #94a3b8; font-size: .85rem; }
    .no-sources i { font-size: 2.5rem; opacity: .3; display: block; margin-bottom: .5rem; }

    /* Add source btn */
    .btn-add-src { background: #f8fafc; border: 1.5px dashed #cbd5e1; border-radius: 12px;
      color: #64748b; padding: .5rem 1rem; font-size: .83rem; font-family: 'Vazirmatn', sans-serif;
      cursor: pointer; width: 100%; transition: all .15s; display: flex; align-items: center;
      justify-content: center; gap: .4rem; }
    .btn-add-src:hover { border-color: #2563eb; color: #2563eb; background: #eff6ff; }

    /* Modals */
    .modal-content { border-radius: 16px; border: none; box-shadow: 0 20px 60px rgba(0,0,0,.15); }
    .modal-header { border-bottom: 1px solid #f1f5f9; padding: 1.1rem 1.4rem; }
    .modal-body  { padding: 1.4rem; }
    .modal-footer { border-top: 1px solid #f1f5f9; padding: .9rem 1.4rem; }
    .form-label { font-size: .81rem; color: #475569; font-weight: 500; }
    .form-control { border: 1.5px solid #e2e8f0; border-radius: 10px;
      padding: .5rem .9rem; font-family: 'Vazirmatn', sans-serif; }
    .form-control:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px #eff6ff; }
    .form-text { font-size: .75rem; color: #94a3b8; margin-top: 4px; }

    /* Toast */
    .toast-container { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); z-index: 9999; }
    .toast { font-size: .85rem; border-radius: 12px; padding: .6rem 1.2rem; font-family: 'Vazirmatn', sans-serif; }

    /* Spinner */
    .spin { animation: spin .7s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Scrollbar */
    .sidebar-list::-webkit-scrollbar { width: 4px; }
    .sidebar-list::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 4px; }
  </style>
</head>
<body>

<!-- ══ TOPBAR ══════════════════════════════════════════ -->
<div class="topbar">
  <div class="topbar-brand"><i class="bi bi-telegram"></i> TeleFilter</div>

  <div id="connBadge" class="conn-badge loading">
    <i class="bi bi-circle-fill spin"></i> در حال اتصال…
  </div>

  <div class="topbar-actions">
    <button class="btn-topbar" onclick="openSettings()">
      <i class="bi bi-gear-fill"></i> تنظیمات API
    </button>
    <button class="btn-save" id="saveBtn" onclick="saveAll()">
      <i class="bi bi-floppy-fill"></i> ذخیره تغییرات
    </button>
  </div>
</div>

<!-- ══ LAYOUT ═══════════════════════════════════════════ -->
<div class="layout">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-head">
      <div class="sidebar-head-title">
        <i class="bi bi-bookmark-star-fill"></i> Topics
      </div>
      <div class="sidebar-head-btns">
        <button class="btn btn-sm btn-outline-secondary" id="syncBtn"
          style="border-radius:7px;padding:3px 8px;font-size:.75rem"
          onclick="syncTopics()" title="دریافت از تلگرام">
          <i class="bi bi-arrow-clockwise" id="syncIcon"></i>
        </button>
        <button class="btn btn-sm btn-primary"
          style="border-radius:7px;padding:3px 9px"
          onclick="openCreateTopic()" title="Topic جدید">
          <i class="bi bi-plus-lg"></i>
        </button>
      </div>
    </div>
    <div class="sidebar-list" id="topicList">
      <div class="sidebar-msg"><i class="bi bi-hourglass-split spin"></i>در حال بارگذاری…</div>
    </div>
  </div>

  <!-- Main -->
  <div class="main" id="mainPanel">
    <div class="empty-state">
      <i class="bi bi-ui-checks-grid"></i>
      <h5>یک Topic انتخاب کن</h5>
      <p class="text-muted">Topics گروه تلگرامت را از سایدبار انتخاب کن<br>یا با دکمه <strong>+</strong> یک Topic جدید بساز</p>
    </div>
  </div>
</div>

<!-- ══ MODAL: Settings ══════════════════════════════════ -->
<div class="modal fade" id="settingsModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-600"><i class="bi bi-gear-fill me-2" style="color:#2563eb"></i>تنظیمات API تلگرام</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">API ID</label>
          <input type="text" class="form-control" id="s_api_id" dir="ltr" placeholder="12345678">
        </div>
        <div class="mb-3">
          <label class="form-label">API Hash</label>
          <input type="text" class="form-control font-monospace" id="s_api_hash" dir="ltr">
        </div>
        <div class="mb-1">
          <label class="form-label">Target Group ID</label>
          <input type="text" class="form-control" id="s_group_id" dir="ltr" placeholder="-1001234567890">
          <div class="form-text">گروهی که Forum Topics دارد و پیام‌ها در آن فوروارد می‌شوند</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" style="border-radius:9px" onclick="saveSettings()">
          <i class="bi bi-check-lg me-1"></i>ذخیره
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ══ MODAL: Create Topic ══════════════════════════════ -->
<div class="modal fade" id="createModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" style="font-size:.95rem">
          <i class="bi bi-plus-circle-fill me-2" style="color:#2563eb"></i>Topic جدید
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <label class="form-label">عنوان Topic</label>
        <input type="text" class="form-control" id="newTopicTitle" placeholder="مثال: دلار"
          onkeydown="if(event.key==='Enter') doCreateTopic()">
        <div class="form-text">این Topic مستقیماً در گروه تلگرامت ساخته می‌شود</div>
      </div>
      <div class="modal-footer" style="gap:.5rem">
        <button class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">انصراف</button>
        <button class="btn btn-sm btn-primary" id="createBtn" style="border-radius:8px" onclick="doCreateTopic()">
          <i class="bi bi-telegram me-1"></i>ساخت در تلگرام
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ══ Toast ════════════════════════════════════════════ -->
<div class="toast-container">
  <div id="toast" class="toast align-items-center text-white border-0 hide" role="alert" style="display:none">
    <div class="d-flex">
      <div class="toast-body" id="toastMsg"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════
//  State
// ═══════════════════════════════════════════════════════
let tgTopics  = [];   // [{id, title}] — از تلگرام
let cfgMap    = {};   // {topic_id: {sources: [...]}} — از config
let apiCfg    = {api_id:'', api_hash:'', target_group_id:''};
let selId     = null; // topic_id انتخاب‌شده
let tgOk      = false;
let forumOk   = false;

let settingsMdl, createMdl;

// ═══════════════════════════════════════════════════════
//  Boot
// ═══════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', async () => {
  settingsMdl = new bootstrap.Modal(document.getElementById('settingsModal'));
  createMdl   = new bootstrap.Modal(document.getElementById('createModal'));

  await checkStatus();
  const cfg = await (await fetch('/api/config')).json();
  apiCfg = { api_id: cfg.api_id||'', api_hash: cfg.api_hash||'', target_group_id: cfg.target_group_id||'' };
  cfgMap = buildCfgMap(cfg.topics || []);

  await syncTopics();
  markClean();
});

// ═══════════════════════════════════════════════════════
//  Connection status
// ═══════════════════════════════════════════════════════
async function checkStatus() {
  try {
    const s = await (await fetch('/api/status')).json();
    tgOk    = s.connected;
    forumOk = s.has_forum_api;
    const badge = document.getElementById('connBadge');
    if (tgOk) {
      badge.className = 'conn-badge ok';
      badge.innerHTML = '<i class="bi bi-circle-fill"></i> متصل به تلگرام';
    } else {
      badge.className = 'conn-badge err';
      badge.innerHTML = '<i class="bi bi-circle-fill"></i> قطع از تلگرام';
    }
  } catch(e) {
    document.getElementById('connBadge').className = 'conn-badge err';
    document.getElementById('connBadge').innerHTML = '<i class="bi bi-circle-fill"></i> خطا';
  }
}

// ═══════════════════════════════════════════════════════
//  Telegram Topics sync
// ═══════════════════════════════════════════════════════
async function syncTopics() {
  const icon = document.getElementById('syncIcon');
  icon.className = 'bi bi-arrow-clockwise spin';

  if (!tgOk || !forumOk) {
    renderSidebar();
    icon.className = 'bi bi-arrow-clockwise';
    return;
  }

  try {
    const res  = await fetch('/api/telegram/topics');
    const data = await res.json();
    if (data.topics) {
      tgTopics = data.topics;
    } else {
      showToast(data.msg || 'خطا در دریافت Topics', 'danger');
    }
  } catch(e) {
    showToast('خطای شبکه', 'danger');
  }
  renderSidebar();
  icon.className = 'bi bi-arrow-clockwise';
}

// ═══════════════════════════════════════════════════════
//  Create Topic
// ═══════════════════════════════════════════════════════
function openCreateTopic() {
  if (!tgOk)    { showToast('ابتدا وارد تلگرام شو (python helper.py)', 'warning'); return; }
  if (!forumOk) { showToast('pip install --upgrade telethon', 'warning'); return; }
  document.getElementById('newTopicTitle').value = '';
  createMdl.show();
  setTimeout(() => document.getElementById('newTopicTitle').focus(), 300);
}

async function doCreateTopic() {
  const title = document.getElementById('newTopicTitle').value.trim();
  if (!title) return;

  const btn = document.getElementById('createBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="bi bi-hourglass-split spin me-1"></i>در حال ساخت…';

  try {
    const res  = await fetch('/api/telegram/topics', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({title})
    });
    const data = await res.json();
    if (data.ok && data.topic_id) {
      tgTopics.unshift({id: data.topic_id, title: data.title});
      createMdl.hide();
      renderSidebar();
      selectTopic(data.topic_id);
      showToast(`Topic «${data.title}» ساخته شد ✓`, 'success');
    } else {
      showToast(data.msg || 'خطا در ساخت Topic', 'danger');
    }
  } catch(e) {
    showToast('خطای شبکه', 'danger');
  }

  btn.disabled = false;
  btn.innerHTML = '<i class="bi bi-telegram me-1"></i>ساخت در تلگرام';
}

// ═══════════════════════════════════════════════════════
//  Topic selection
// ═══════════════════════════════════════════════════════
function selectTopic(id) {
  selId = id;
  renderSidebar();
  renderMain();
}

// ═══════════════════════════════════════════════════════
//  Settings
// ═══════════════════════════════════════════════════════
function openSettings() {
  document.getElementById('s_api_id').value    = apiCfg.api_id;
  document.getElementById('s_api_hash').value  = apiCfg.api_hash;
  document.getElementById('s_group_id').value  = apiCfg.target_group_id;
  settingsMdl.show();
}

function saveSettings() {
  apiCfg.api_id          = document.getElementById('s_api_id').value.trim();
  apiCfg.api_hash        = document.getElementById('s_api_hash').value.trim();
  apiCfg.target_group_id = document.getElementById('s_group_id').value.trim();
  settingsMdl.hide();
  markDirty();
}

// ═══════════════════════════════════════════════════════
//  Sources CRUD
// ═══════════════════════════════════════════════════════
function ensureCfg(id) {
  if (!cfgMap[id]) cfgMap[id] = {sources: []};
  return cfgMap[id];
}

function addSource() {
  ensureCfg(selId).sources.push({chat:'', filters:[]});
  renderMain();
  markDirty();
  setTimeout(() => {
    const inputs = document.querySelectorAll('.src-top input');
    if (inputs.length) inputs[inputs.length-1].focus();
  }, 50);
}

function deleteSource(si) {
  ensureCfg(selId).sources.splice(si, 1);
  renderMain();
  markDirty();
}

function updateChat(si, val) {
  ensureCfg(selId).sources[si].chat = val;
  markDirty();
}

// ═══════════════════════════════════════════════════════
//  Filters CRUD
// ═══════════════════════════════════════════════════════
function onFilterKey(e, si) {
  if (e.key === 'Enter') {
    const phrase = e.target.value.trim();
    if (!phrase) return;
    ensureCfg(selId).sources[si].filters.push(phrase);
    e.target.value = '';
    renderMain();
    markDirty();
    setTimeout(() => {
      const inputs = document.querySelectorAll('.filter-input');
      if (inputs[si]) inputs[si].focus();
    }, 40);
  }
}

function deleteFilter(si, fi) {
  ensureCfg(selId).sources[si].filters.splice(fi, 1);
  renderMain();
  markDirty();
}

// ═══════════════════════════════════════════════════════
//  Save
// ═══════════════════════════════════════════════════════
async function saveAll() {
  const topics = [];
  for (const [idStr, data] of Object.entries(cfgMap)) {
    if (data.sources && data.sources.length > 0) {
      const id  = parseInt(idStr);
      const tgt = tgTopics.find(t => t.id === id);
      topics.push({ topic_id: id, name: tgt ? tgt.title : '', sources: data.sources });
    }
  }
  const payload = { ...apiCfg, topics };
  await fetch('/api/config', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  });
  markClean();
  showToast('تغییرات ذخیره شد ✓', 'success');
}

// ═══════════════════════════════════════════════════════
//  Render: Sidebar
// ═══════════════════════════════════════════════════════
function renderSidebar() {
  const el = document.getElementById('topicList');

  if (!tgOk) {
    el.innerHTML = `<div class="sidebar-msg">
      <i class="bi bi-plug-fill" style="color:#fca5a5"></i>
      وارد تلگرام نشدی.<br>اول <code>python helper.py</code> را اجرا کن سپس panel را ری‌استارت کن.
    </div>`;
    return;
  }
  if (!forumOk) {
    el.innerHTML = `<div class="sidebar-msg">
      <i class="bi bi-exclamation-triangle-fill" style="color:#fde68a"></i>
      نسخه Telethon قدیمی است.<br><code>pip install --upgrade telethon</code>
    </div>`;
    return;
  }
  if (!tgTopics.length) {
    el.innerHTML = `<div class="sidebar-msg">
      <i class="bi bi-inbox"></i>
      گروه Topic ندارد یا هنوز Sync نشده.<br>
      مطمئن شو گروه «Forum» فعال است.
    </div>`;
    return;
  }

  el.innerHTML = tgTopics.map(t => {
    const srcCount = cfgMap[t.id]?.sources?.length || 0;
    return `
      <div class="topic-row ${t.id === selId ? 'active' : ''}" onclick="selectTopic(${t.id})">
        <div style="overflow:hidden;flex:1">
          <div class="t-name">${esc(t.title)}</div>
          <div class="t-meta">ID: ${t.id}</div>
        </div>
        <span class="t-src-badge ${srcCount ? '' : 'empty'}">${srcCount ? srcCount+' سورس' : 'بدون سورس'}</span>
      </div>
    `;
  }).join('');
}

// ═══════════════════════════════════════════════════════
//  Render: Main panel
// ═══════════════════════════════════════════════════════
function renderMain() {
  const el = document.getElementById('mainPanel');

  if (!selId) {
    el.innerHTML = `<div class="empty-state">
      <i class="bi bi-ui-checks-grid"></i>
      <h5>یک Topic انتخاب کن</h5>
      <p class="text-muted">Topics گروه را از سایدبار انتخاب کن</p>
    </div>`;
    return;
  }

  const tgt    = tgTopics.find(t => t.id === selId);
  const title  = tgt ? tgt.title : `Topic ${selId}`;
  const sources = cfgMap[selId]?.sources || [];

  el.innerHTML = `
    <div class="topic-hdr">
      <div class="topic-hdr-icon"><i class="bi bi-hash"></i></div>
      <div>
        <div class="topic-hdr-title">${esc(title)}</div>
        <div class="topic-hdr-id">Topic ID: ${selId}</div>
      </div>
    </div>

    <div class="sec-head">
      <h6><i class="bi bi-broadcast-pin"></i> سورس‌ها</h6>
      <button class="btn btn-sm btn-outline-primary" style="border-radius:8px;font-size:.8rem" onclick="addSource()">
        <i class="bi bi-plus-lg me-1"></i>افزودن سورس
      </button>
    </div>

    ${sources.length === 0 ? `
      <div class="no-sources">
        <i class="bi bi-inbox"></i>
        هنوز سورسی اضافه نشده.<br>روی «افزودن سورس» کلیک کن.
      </div>
    ` : sources.map((src, si) => `
      <div class="source-card">
        <div class="src-top">
          <i class="bi bi-telegram"></i>
          <input type="text" dir="ltr" value="${esc(src.chat||'')}"
            onchange="updateChat(${si}, this.value)"
            placeholder="@username  یا  Chat ID عددی">
          <button class="src-del" onclick="deleteSource(${si})" title="حذف سورس">
            <i class="bi bi-x-circle-fill"></i>
          </button>
        </div>
        <div class="filter-area">
          <span class="filter-lbl">فیلترها:</span>
          ${(src.filters||[]).map((f,fi) => `
            <span class="filter-tag">
              ${esc(f)}
              <button onclick="deleteFilter(${si},${fi})" title="حذف"><i class="bi bi-x"></i></button>
            </span>
          `).join('')}
          ${!(src.filters||[]).length ? `<span class="all-badge"><i class="bi bi-asterisk me-1"></i>همه پیام‌ها</span>` : ''}
          <input class="filter-input" placeholder="عبارت جدید…  Enter"
            onkeydown="onFilterKey(event,${si})">
        </div>
      </div>
    `).join('')}

    ${sources.length > 0 ? `
      <button class="btn-add-src" onclick="addSource()">
        <i class="bi bi-plus-circle"></i> افزودن سورس دیگر
      </button>` : ''}
  `;
}

// ═══════════════════════════════════════════════════════
//  Utils
// ═══════════════════════════════════════════════════════
function buildCfgMap(topics) {
  const m = {};
  for (const t of topics) m[t.topic_id] = { sources: t.sources || [] };
  return m;
}

function markDirty() {
  const b = document.getElementById('saveBtn');
  b.className = 'btn-save dirty';
  b.innerHTML = '<i class="bi bi-floppy-fill"></i> ذخیره تغییرات *';
}
function markClean() {
  const b = document.getElementById('saveBtn');
  b.className = 'btn-save';
  b.innerHTML = '<i class="bi bi-floppy-fill"></i> ذخیره تغییرات';
}

function showToast(msg, type='success') {
  const t  = document.getElementById('toast');
  const tm = document.getElementById('toastMsg');
  const colors = {success:'#16a34a', danger:'#dc2626', warning:'#d97706'};
  t.style.background = colors[type] || '#1e40af';
  t.style.display = 'block';
  tm.textContent = msg;
  setTimeout(() => { t.style.display = 'none'; }, 3000);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
