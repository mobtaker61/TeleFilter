<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>نمودارهای {{ owner_name }} — TeleFilter</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { font-family:'Vazirmatn',sans-serif; box-sizing:border-box; }
    body { background:linear-gradient(180deg,#f8fafc 0%,#eef2ff 100%); color:#0f172a;
      min-height:100vh; padding:1.5rem 1rem; }
    .container-x { max-width:1400px; margin:0 auto; }
    .page-hdr { background:#fff; border-radius:18px; padding:1.4rem 1.6rem; margin-bottom:1.5rem;
      box-shadow:0 12px 35px rgba(15,23,42,.07); display:flex; align-items:center;
      gap:1rem; flex-wrap:wrap; }
    .page-hdr .ico { width:48px; height:48px; background:linear-gradient(135deg,#1e40af,#3b82f6);
      border-radius:14px; display:flex; align-items:center; justify-content:center;
      color:#fff; font-size:1.4rem; }
    .page-hdr h1 { font-size:1.2rem; font-weight:700; margin:0; color:#1e293b; }
    .page-hdr .sub { font-size:.78rem; color:#64748b; margin-top:.2rem; }
    .range-bar { display:flex; gap:.4rem; margin-right:auto; flex-wrap:wrap; }
    .range-btn { border:1px solid #cbd5e1; background:#fff; color:#475569; border-radius:10px;
      padding:.35rem .9rem; font-size:.8rem; cursor:pointer; transition:.15s; }
    .range-btn:hover { border-color:#94a3b8; }
    .range-btn.active { background:#1e40af; color:#fff; border-color:#1e40af; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(460px, 1fr)); gap:1.25rem; }
    .chart-card { background:#fff; border-radius:16px; box-shadow:0 8px 25px rgba(15,23,42,.06);
      padding:1.2rem 1.3rem; transition:.2s; }
    .chart-card:hover { box-shadow:0 14px 38px rgba(15,23,42,.1); transform:translateY(-1px); }
    .chart-hdr { display:flex; align-items:center; justify-content:space-between; gap:.8rem;
      margin-bottom:.4rem; padding-bottom:.6rem; border-bottom:1px solid #f1f5f9; }
    .chart-title { font-weight:600; color:#1e293b; font-size:1rem; line-height:1.3; }
    .chart-sub { font-size:.72rem; color:#94a3b8; margin-top:.15rem; }
    .latest-box { text-align:center; min-width:130px; }
    .latest-val { font-weight:700; font-size:1.4rem; color:#1e40af; line-height:1.1;
      transition: color .25s ease, transform .25s ease; }
    .latest-val.bump { transform: scale(1.08); }
    .latest-time { font-size:.65rem; color:#94a3b8; margin-top:.15rem; }
    .change-badge { display:inline-block; margin-top:.3rem; padding:2px 8px; border-radius:8px;
      font-size:.7rem; font-weight:600; line-height:1.4; transition: background .25s ease; }
    .change-badge.up   { background:#dcfce7; color:#166534; }
    .change-badge.down { background:#fee2e2; color:#991b1b; }
    .change-badge.flat { background:#f1f5f9; color:#475569; }
    .change-badge.new  { background:#e0f2fe; color:#075985; }
    .chart-cnv { min-height:260px; }
    .empty-msg { text-align:center; padding:4rem 1rem; color:#94a3b8; background:#fff;
      border-radius:16px; }
    .empty-msg i { font-size:3rem; display:block; margin-bottom:1rem; opacity:.4; }
    .ftr { text-align:center; margin-top:2rem; color:#94a3b8; font-size:.75rem; }
    .ftr a { color:#64748b; text-decoration:none; }
    .badge-public { background:#dcfce7; color:#166534; padding:.25rem .65rem; border-radius:10px;
      font-size:.7rem; font-weight:600; }
    .apexcharts-toolbar { transform: scaleX(-1); }
    .apexcharts-toolbar > * { transform: scaleX(-1); }
  </style>
</head>
<body>
<div class="container-x">

  <div class="page-hdr">
    <div class="ico"><i class="bi bi-graph-up-arrow"></i></div>
    <div>
      <h1>نمودارهای {{ owner_name }}</h1>
      <div class="sub"><span class="badge-public"><i class="bi bi-globe2 me-1"></i>صفحهٔ عمومی</span></div>
    </div>
    <div class="range-bar" id="rangeBar">
      <button class="range-btn" data-h="24">۲۴ ساعت</button>
      <button class="range-btn active" data-h="168">۷ روز</button>
      <button class="range-btn" data-h="720">۳۰ روز</button>
      <button class="range-btn" data-h="2160">۹۰ روز</button>
      <button class="range-btn" data-h="4320">۶ ماه</button>
    </div>
  </div>

  <div id="content">
    <div class="empty-msg"><i class="bi bi-hourglass-split"></i>در حال بارگذاری…</div>
  </div>

  <div class="ftr">
    قدرت‌گرفته از <a href="/" target="_blank">TeleFilter</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<script>
const token = {{ token|tojson }};
let currentHours = 168;
// state per chart: { chart, lastTime, lastValue, label, mode }
const charts = new Map();

function fmtNum(n) {
  if (n == null) return '—';
  if (Number.isInteger(n)) return n.toLocaleString('en-US');
  return Number(n).toLocaleString('en-US', { maximumFractionDigits: 4 });
}

function fmtDt(s) {
  if (!s) return '';
  const d = new Date(s.replace(' ', 'T') + 'Z');
  return d.toLocaleString('fa-IR', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });
}

function changeBadgeHtml(change) {
  if (!change || change.dir === 'new') {
    return `<div class="change-badge new"><i class="bi bi-stars"></i> اولین نرخ</div>`;
  }
  if (change.dir === 'flat') {
    return `<div class="change-badge flat"><i class="bi bi-dash"></i> بدون تغییر</div>`;
  }
  const sign = change.dir === 'up' ? '+' : '';
  const arrow = change.dir === 'up' ? '▲' : '▼';
  const cls = change.dir === 'up' ? 'up' : 'down';
  const pct = change.pct ? `(${sign}${change.pct.toFixed(2)}%)` : '';
  return `<div class="change-badge ${cls}">${arrow} ${sign}${fmtNum(change.diff)} ${pct}</div>`;
}

// ── ساخت اولیه‌ی صفحه (یک بار) ───────────────────────────
async function buildPage() {
  const r = await fetch(`/api/public/${token}/charts`);
  if (!r.ok) {
    document.getElementById('content').innerHTML =
      '<div class="empty-msg"><i class="bi bi-exclamation-triangle"></i>لینک نامعتبر است</div>';
    return;
  }
  const d = await r.json();
  if (!d.charts || !d.charts.length) {
    document.getElementById('content').innerHTML =
      '<div class="empty-msg"><i class="bi bi-inbox"></i>هنوز نموداری منتشر نشده است</div>';
    return;
  }
  // اگر تعداد یا keys چارت‌ها عوض شد، rebuild — وگرنه فقط مقادیر را به‌روز کن
  const wantedKeys = d.charts.map(c => `${c.group_id}:${c.topic_id}`);
  const currentKeys = Array.from(charts.keys());
  const needsRebuild =
    currentKeys.length !== wantedKeys.length ||
    wantedKeys.some(k => !charts.has(k));

  if (needsRebuild) {
    // پاک کردن چارت‌های قبلی
    for (const [, st] of charts) { try { st.chart?.destroy(); } catch {} }
    charts.clear();
    document.getElementById('content').innerHTML =
      `<div class="grid">${d.charts.map(c => cardHtml(c)).join('')}</div>`;
    for (const c of d.charts) {
      charts.set(`${c.group_id}:${c.topic_id}`, {
        chart: null, lastTime: null, lastValue: null,
        label: c.chart_label || c.name || `Topic ${c.topic_id}`,
        mode: null,
      });
    }
    for (const c of d.charts) await refreshChart(c.group_id, c.topic_id, true);
  } else {
    // فقط مقادیر بالای کارت + چارت را به‌روز کن (بدون rerender header)
    for (const c of d.charts) {
      updateLatestBox(c);
      await refreshChart(c.group_id, c.topic_id, false);
    }
  }
}

function cardHtml(c) {
  const last = c.last_value != null ? fmtNum(c.last_value) : '—';
  const ts = c.last_time ? fmtDt(c.last_time) : 'بدون داده';
  return `
    <div class="chart-card" data-key="${c.group_id}:${c.topic_id}">
      <div class="chart-hdr">
        <div>
          <div class="chart-title">${escapeHtml(c.chart_label || c.name || `Topic ${c.topic_id}`)}</div>
          <div class="chart-sub">${escapeHtml(c.group_title || '')}</div>
        </div>
        <div class="latest-box" id="lb_${c.group_id}_${c.topic_id}">
          <div class="latest-val">${last}</div>
          <div class="latest-time">${ts}</div>
          ${changeBadgeHtml(c.change)}
        </div>
      </div>
      <div id="cnv_${c.group_id}_${c.topic_id}" class="chart-cnv"></div>
    </div>`;
}

function updateLatestBox(c) {
  const box = document.getElementById(`lb_${c.group_id}_${c.topic_id}`);
  if (!box) return;
  const last = c.last_value != null ? fmtNum(c.last_value) : '—';
  const ts = c.last_time ? fmtDt(c.last_time) : 'بدون داده';
  box.innerHTML = `
    <div class="latest-val bump">${last}</div>
    <div class="latest-time">${ts}</div>
    ${changeBadgeHtml(c.change)}`;
  // bump انیمیشن کوتاه
  setTimeout(() => {
    const v = box.querySelector('.latest-val');
    if (v) v.classList.remove('bump');
  }, 280);
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, m =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ── به‌روزرسانی چارت با diff check ───────────────────────
async function refreshChart(gid, tid, force) {
  const key = `${gid}:${tid}`;
  const st = charts.get(key);
  if (!st) return;
  const r = await fetch(`/api/public/${token}/charts/${gid}/${tid}/data?hours=${currentHours}`);
  if (!r.ok) return;
  const d = await r.json();
  if (!d.ok) return;

  const newTime = d.latest?.created_at || null;
  const newVal = d.latest?.value ?? null;
  const sameMode = st.mode === d.mode;

  // اگر تغییری نکرده، rerender نکن
  if (!force && sameMode && newTime === st.lastTime && newVal === st.lastValue) return;

  st.lastTime = newTime;
  st.lastValue = newVal;
  st.mode = d.mode;
  renderOrUpdate(gid, tid, d.rates, st.label, d.mode);
}

function renderOrUpdate(gid, tid, rates, label, mode) {
  const key = `${gid}:${tid}`;
  const st = charts.get(key);
  if (!st) return;
  const data = rates.map(r => ({
    x: new Date(r.created_at.replace(' ', 'T') + 'Z').getTime(),
    y: r.value,
  }));

  // اگر چارت قبلاً ساخته شده، فقط update — بدون نابودی (انیمیشن نرم)
  if (st.chart) {
    try {
      st.chart.updateSeries([{ name: label || 'نرخ', data }], true);
      return;
    } catch {
      try { st.chart.destroy(); } catch {}
      st.chart = null;
    }
  }

  const el = document.getElementById(`cnv_${gid}_${tid}`);
  if (!el) return;

  const options = {
    chart: {
      type: 'area',
      height: 280,
      fontFamily: 'Vazirmatn, sans-serif',
      animations: { enabled: true, speed: 350, dynamicAnimation: { speed: 350 } },
      zoom: { enabled: true, type: 'x', autoScaleYaxis: true },
      toolbar: {
        show: true,
        tools: { download: false, selection: true, zoom: true, zoomin: true, zoomout: true, pan: true, reset: true },
        autoSelected: 'zoom',
      },
    },
    series: [{ name: label || 'نرخ', data }],
    dataLabels: { enabled: false },
    stroke: { curve: 'smooth', width: 2.2 },
    fill: {
      type: 'gradient',
      gradient: { shadeIntensity: 1, opacityFrom: .35, opacityTo: 0, stops: [0, 90, 100] },
    },
    colors: ['#1e40af'],
    markers: { size: 0, hover: { size: 5 } },
    grid: { borderColor: '#e2e8f0', strokeDashArray: 3 },
    xaxis: {
      type: 'datetime',
      labels: { datetimeUTC: false, style: { fontFamily: 'Vazirmatn', fontSize: '10px' } },
      axisBorder: { show: false },
      axisTicks: { color: '#e2e8f0' },
    },
    yaxis: {
      labels: {
        style: { fontFamily: 'Vazirmatn', fontSize: '10px' },
        formatter: v => fmtNum(v),
      },
      opposite: true,
    },
    tooltip: {
      theme: 'light',
      x: { format: mode === 'daily' ? 'yyyy/MM/dd' : 'yyyy/MM/dd HH:mm' },
      y: { formatter: v => fmtNum(v) },
      style: { fontFamily: 'Vazirmatn' },
    },
    legend: { show: false },
    noData: { text: 'داده‌ای موجود نیست', style: { fontFamily: 'Vazirmatn', color: '#94a3b8' } },
  };

  st.chart = new ApexCharts(el, options);
  st.chart.render();
}

document.querySelectorAll('.range-btn').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.range-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    currentHours = parseInt(b.dataset.h, 10);
    // برای تغییر بازه، force update همه چارت‌ها
    for (const [k, st] of charts) {
      const [gid, tid] = k.split(':');
      refreshChart(gid, tid, true);
    }
  };
});

// init + هر ۲۰ ثانیه فقط diff-check (نه rerender)
buildPage();
setInterval(buildPage, 20000);
</script>
</body>
</html>
