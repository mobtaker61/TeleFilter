<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeleFilter — ورود</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { font-family: 'Vazirmatn', sans-serif; box-sizing: border-box; }
    body { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 60%, #0f172a 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #fff; border-radius: 24px; padding: 2.5rem 2.25rem; max-width: 380px; width: 90%;
      box-shadow: 0 30px 80px rgba(0,0,0,.4); text-align: center; }
    .logo { width: 72px; height: 72px; background: linear-gradient(135deg,#1e40af,#3b82f6);
      border-radius: 20px; margin: 0 auto 1.25rem; display: flex; align-items: center;
      justify-content: center; font-size: 2rem; color: #fff; box-shadow: 0 8px 20px rgba(37,99,235,.4); }
    h4 { font-weight: 700; color: #1e293b; margin-bottom: .3rem; }
    .subtitle { color: #64748b; font-size: .88rem; margin-bottom: 2rem; line-height: 1.6; }
    .tg-btn-wrap { display: flex; justify-content: center; margin-bottom: 1.5rem; min-height: 44px; }
    .err { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca;
      border-radius: 10px; padding: .6rem 1rem; font-size: .82rem; margin-top: .5rem; display: none; }
    .footer-note { font-size: .74rem; color: #94a3b8; margin-top: 1.5rem; line-height: 1.7; }
    .footer-note a { color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo"><i class="bi bi-telegram"></i></div>
  <h4>TeleFilter</h4>
  <p class="subtitle">
    برای ورود روی دکمه زیر کلیک کن.<br>
    هویتت از طریق تلگرام تأیید می‌شود.
  </p>

  <!-- Telegram Login Widget -->
  <div class="tg-btn-wrap" id="tgWidgetWrap">
    <script
      async
      src="https://telegram.org/js/telegram-widget.js?22"
      data-telegram-login="{{ bot_username }}"
      data-size="large"
      data-radius="10"
      data-onauth="onTelegramAuth(user)"
      data-request-access="write">
    </script>
  </div>

  <div class="err" id="loginErr"></div>

  <p class="footer-note">
    ورود فقط برای کاربران مجاز امکان‌پذیر است.<br>
    پس از اولین ورود، ادمین باید حسابت را تأیید کند.
  </p>
</div>

<script>
async function onTelegramAuth(user) {
  document.getElementById('tgWidgetWrap').innerHTML =
    '<div style="color:#64748b;font-size:.85rem"><i class="bi bi-hourglass-split" style="animation:spin .7s linear infinite;display:inline-block"></i> در حال تأیید…</div>';
  try {
    const r = await fetch('/auth/telegram', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(user)
    });
    const d = await r.json();
    if (d.ok) {
      window.location.href = '/';
    } else {
      showErr(d.error || 'خطا در ورود');
      setTimeout(() => location.reload(), 2000);
    }
  } catch {
    showErr('خطای شبکه — دوباره تلاش کن');
  }
}
function showErr(msg) {
  const e = document.getElementById('loginErr'); e.textContent = msg; e.style.display = 'block';
}
</script>
<style>@keyframes spin { to { transform: rotate(360deg); } }</style>
</body>
</html>
